spring:
  datasource:
    # Pas de serverTimezone force : MySQL et la JVM utilisent tous deux l'heure locale du systeme
    # (confirme via @@session.time_zone = SYSTEM).
    url: jdbc:mysql://localhost:3306/sgdj_db?useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # La base sgdj_db existe deja avec son propre schema SQL.
      # validate verifie uniquement la correspondance entre les entites et la base.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ChangezCetteCleSecreteEnProductionAvecAuMoins256Bits!!}
  expiration: ${JWT_EXPIRATION:3600000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  mail:
    from: ${MAIL_FROM:noreply.sgdj@gmail.com}

  security:
    # Protection contre les tentatives de connexion echouees
    max-failed-attempts: 3

    # Verrouillage progressif
    lockout-step1-minutes: 1
    lockout-step2-minutes: 5

    # Token de reinitialisation du mot de passe
    reset-token-validity-minutes: 10

    # Token de deverrouillage du compte
    unlock-token-validity-minutes: 60

  upload:
    photos-dir: uploads/photos
    documents-dir: secure-uploads/documents
    max-document-size: 10485760