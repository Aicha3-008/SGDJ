spring:
  datasource:
    # Pas de serverTimezone force : MySQL et la JVM utilisent tous deux l'heure locale du systeme
    # (confirme via @@session.time_zone = SYSTEM). Forcer serverTimezone=UTC ici causait un
    # decalage d'1h entre LocalDateTime.now() cote Java et les valeurs relues depuis MySQL,
    # ce qui cassait les comparaisons d'expiration (verrouillage brute-force, tokens).
    url: jdbc:mysql://localhost:3306/sgdj_db?useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # La base sgdj_db existe deja avec son propre schema SQL (voir sql/manual_migration.sql).
      # ddl-auto=validate : Hibernate verifie au demarrage que les entites correspondent au schema
      # reel mais ne cree/n'altere JAMAIS les tables automatiquement.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ChangezCetteCleSecreteEnProductionAvecAuMoins256Bits!!}
  expiration: ${JWT_EXPIRATION:3600000}   # 1h en millisecondes

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply.sgdj@gmail.com}
  security:
    # Protection brute-force progressive : 3 tentatives avant verrouillage complet.
    # Echec 1 -> attente de lockout-step1-minutes, echec 2 -> lockout-step2-minutes,
    # echec 3 -> compte verrouille + email de reactivation.
    max-failed-attempts: 3
    lockout-step1-minutes: 1
    lockout-step2-minutes: 5
    reset-token-validity-minutes: 10
    unlock-token-validity-minutes: 60
  upload:
    photos-dir: uploads/photos
